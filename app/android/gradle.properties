org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler cache can't compute a relative path when
# the project (B:\...) and the Gradle/pub caches (C:\Users\...) are on
# different Windows drive letters — it throws mid-build instead of
# falling back gracefully. Disabling incremental compilation avoids the
# crash entirely; the cost is a slightly slower rebuild, not a runtime
# behavior change.
kotlin.incremental=false
